# REUSE.toml — which licence covers which path (M7 open-source cut, 9 Oct 2026).
#
# REUSE (https://reuse.software, spec 3.2) is the precedent. HOW A FILE GETS ITS
# LICENCE, and why the ORDER below matters: a file with its own
# `SPDX-License-Identifier` header keeps it ("closest"); a file with no header
# takes the LAST [[annotations]] table whose path matches it. So the catch-all
# `**` (AGPL-3.0-only) comes FIRST and every narrower zone comes after it: the
# Apache-2.0 directories, vendor/gondolin, ee/, and then one table per file
# copied from an upstream project. Moving `**` below any of them would relabel
# that zone AGPL. scripts/lib/reuse.mjs resolves every file the way REUSE does
# (the public export uses it to list each file's licence), and
# tests/integration/scripts/reuse-attribution.test.ts checks the ordering.
# This is how the tree states a licence for every file without rewriting
# each one.
#
# Files COPIED from upstream are listed in the
# generated block at the end, with the licence and copyright holder their own
# `// Provenance:` header names. vendor/gondolin keeps Gondolin's Apache-2.0.
#
# The texts are in LICENSES/. Licence files themselves (LICENSE, NOTICE) are
# not code and are not annotated.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sam Rahmani and Tyler Stewart"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
# Vibtra Guard v0 (16 Oct 2026): packages/guard-contract (the wire contract) and guard/ (the agents, the macOS
# app) are the Apache zone — scripts/lib/ee-boundary.mjs APACHE_PREFIXES names the same two.
path = ["packages/guard-contract/**", "guard/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sam Rahmani and Tyler Stewart"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "vendor/gondolin/**"
precedence = "closest"
SPDX-FileCopyrightText = "Earendil Works and contributors; Sam Rahmani and Tyler Stewart patch set 2026"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "ee/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Sam Rahmani and Tyler Stewart"
SPDX-License-Identifier = "LicenseRef-Vibtra-Enterprise"

