name: PR base
description: Resolve the diff base of the pull request that started the run. It reads the PR's current base branch from the GitHub API, fetches that branch's tip and the PR head as data, and takes their merge base. The base SHA in the event payload is a snapshot from when the PR was opened, pushed or retargeted, so it goes stale when the base branch moves or the PR is retargeted. Fails when the API does not answer, the branch name is not valid, or the PR head moved past the event's head SHA.
inputs:
  path:
    description: The checkout of this repository to fetch into, relative to the workspace.
    default: .
outputs:
  merge_base:
    description: The merge base of the PR head and the tip of the PR's current base branch. Diff from it.
    value: ${{ steps.resolve.outputs.merge_base }}
  base_ref:
    description: The PR's current base branch, from the GitHub API. Fetched to refs/remotes/pr/base.
    value: ${{ steps.resolve.outputs.base_ref }}
runs:
  using: composite
  steps:
    - name: Read the PR's current base branch from the GitHub API, fetch its tip and the PR head as data and take their merge base
      id: resolve
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        base_ref="$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
          "${GITHUB_API_URL}/repos/${REPO}/pulls/${PR_NUMBER}" | jq -er '.base.ref')"
        if ! git check-ref-format "refs/heads/${base_ref}"; then
          echo "The base branch name from the GitHub API is not a valid branch name." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
        echo "::add-mask::$auth"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin \
          "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head" "+refs/heads/${base_ref}:refs/remotes/pr/base"
        if ! git cat-file -e "${HEAD_SHA}^{commit}"; then
          echo "The PR head moved past ${HEAD_SHA}. The run for the new head decides." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        merge_base="$(git merge-base refs/remotes/pr/base "$HEAD_SHA")"
        echo "The PR's current base is ${base_ref}. Merge base of its tip and ${HEAD_SHA}: ${merge_base}."
        echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"
        echo "merge_base=${merge_base}" >> "$GITHUB_OUTPUT"
