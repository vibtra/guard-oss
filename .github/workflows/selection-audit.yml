name: Selection audit
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - tests/selection-map.json
      - scripts/select-tests.mjs
      - scripts/audit-selection.mjs
      - .github/workflows/selection-audit.yml
permissions: {}
concurrency:
  group: selection-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { area: integration/agent-go, exclude: '' }
          - { area: integration/console-api, exclude: '' }
          - { area: integration/coverage, exclude: '' }
          - { area: integration/eslint, exclude: 'integration/eslint/fences-tree.test.ts' }
          - { area: integration/gate, exclude: '' }
          - { area: integration/guard-console, exclude: '' }
          - { area: integration/guard-contract, exclude: '' }
          - { area: integration/infra, exclude: '' }
          - { area: integration/no-comments, exclude: '' }
          - { area: integration/registry, exclude: '' }
          - { area: integration/ui, exclude: '' }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install dependencies, fatrace and the Go modules
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get install -y --no-install-recommends fatrace || { sudo apt-get update && sudo apt-get install -y --no-install-recommends fatrace; }
          go -C guard/agent-go mod download
          go -C tests/support/hello-client mod download
      - name: Run ${{ matrix.area }} alone while fatrace records every file opened
        env:
          AREA: ${{ matrix.area }}
          EXCLUDE: ${{ matrix.exclude }}
          GOPROXY: 'off'
          GOTOOLCHAIN: local
          GOFLAGS: -buildvcs=false
        run: |
          sudo fatrace --current-mount -f O -o "$RUNNER_TEMP/opens.log" &
          tracer=$!
          sleep 1
          status=0
          pnpm --filter @vibtra/guard-tests exec vitest run "$AREA/" ${EXCLUDE:+--exclude "$EXCLUDE"} || status=$?
          sudo kill -INT "$tracer"
          wait "$tracer" || echo "fatrace stopped with status $?"
          echo "fatrace recorded $(wc -l < "$RUNNER_TEMP/opens.log") opens"
          exit "$status"
      - name: Every tracked file the area opened is declared for it in tests/selection-map.json
        env:
          AREA: ${{ matrix.area }}
        run: node scripts/audit-selection.mjs --area "$AREA" --opens "$RUNNER_TEMP/opens.log"
