name: Guard independent checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the Mac jobs (mac and mac-integration) whatever the diff touches
        type: boolean
        default: true
  schedule:
    - cron: '0 17 * * 0'
permissions: {}
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for the gate checks on the pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "$EVENT_NAME event: the gate checks run on pull requests only. Nothing to wait for."
            exit 0
          fi
          checks=(gate-files tripwire probe-replay)
          workflows=(gate-files.yml easing-tripwire.yml gate-replay.yml)
          states=(- - -)
          report() {
            local row
            {
              echo "### Gate checks on $HEAD_SHA"
              echo
              echo "$1"
              echo
              echo "| Check | State |"
              echo "| --- | --- |"
              for row in "${!checks[@]}"; do
                echo "| ${checks[row]} | ${states[row]} |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          }
          ref=$(jq -rn --arg ref "$DEFAULT_BRANCH" '$ref | @uri')
          http_status() {
            gh api --include --silent "repos/$GITHUB_REPOSITORY/contents/$1?ref=$ref" 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || true
          }
          expected=()
          for i in "${!checks[@]}"; do
            workflow=.github/workflows/${workflows[i]}
            for delay in 0 5 10; do
              sleep "$delay"
              status=$(http_status "$workflow")
              case "$status" in 200 | 404) break ;; esac
            done
            case "$status" in
              200) expected+=("$i") ;;
              404) states[i]="not waited for: $workflow is not on $DEFAULT_BRANCH" ;;
              *)
                echo "::error::Could not read $workflow on $DEFAULT_BRANCH (HTTP ${status:-no response})."
                exit 1
                ;;
            esac
          done
          if [ "${#expected[@]}" -eq 0 ]; then
            report "Passed: no gate workflow is on $DEFAULT_BRANCH yet."
            echo "No gate workflow is on $DEFAULT_BRANCH yet. Nothing to wait for."
            exit 0
          fi
          runs="$RUNNER_TEMP/check-runs.json"
          deadline=$((SECONDS + 900))
          while :; do
            waiting=""
            if gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100" > "$runs"; then
              for i in "${expected[@]}"; do
                states[i]=$(jq -rs --arg name "${checks[i]}" '[.[].check_runs[] | select(.name == $name and .app.slug == "github-actions")] | max_by(.id) | if . == null then "missing" elif .status == "completed" then .conclusion else .status end' "$runs")
                case "${states[i]}" in
                  success) ;;
                  missing | requested | queued | waiting | pending | in_progress) waiting+=" ${checks[i]}" ;;
                  *)
                    if [ "${checks[i]}" = tripwire ]; then
                      report "Failed: ${checks[i]} concluded ${states[i]}. Only success passes."
                      echo "::error::${checks[i]} concluded ${states[i]} on $HEAD_SHA. Only success passes. Push a fix, or get an approval on this exact commit and re-run ${checks[i]}. Then re-run this workflow."
                      exit 1
                    fi
                    ;;
                esac
              done
            else
              echo "::warning::Could not list the check runs on $HEAD_SHA. Trying again."
              for i in "${expected[@]}"; do waiting+=" ${checks[i]}"; done
            fi
            line=""
            for i in "${expected[@]}"; do line+=" ${checks[i]}=${states[i]}"; done
            echo "$(date -u +%H:%M:%S)$line"
            if [ -z "$waiting" ]; then
              report "Passed: every expected gate check has finished, and tripwire concluded success where expected."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              report "Failed: after 15 minutes still waiting for$waiting."
              echo "::error::After 15 minutes still waiting for$waiting on $HEAD_SHA."
              exit 1
            fi
            sleep 15
          done
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mac: ${{ steps.mac.outputs.mac }}
    steps:
      - name: Check out with full history, trees only (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Decide whether the diff touches the Mac app
        id: mac
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          decide() {
            echo "mac=$1" >> "$GITHUB_OUTPUT"
            echo "mac=$1: $2"
            {
              echo "### Mac jobs: mac=$1"
              echo
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          mac_path() {
            shopt -s nocasematch
            case "$1" in
              guard/mac/* | tests/mac/* | *.swift | *.xcodeproj/* | project.yml | */project.yml) return 0 ;;
              guard/agent-go/build.sh | guard/agent-go/go.mod) return 0 ;;
              guard/LICENSE | guard/NOTICE | guard/agent-go/THIRD_PARTY_NOTICES.txt) return 0 ;;
              .github/workflows/ci.yml) return 0 ;;
            esac
            return 1
          }
          case "$EVENT_NAME" in
            schedule) decide true "Scheduled run: the Mac jobs always run." ;;
            workflow_dispatch)
              if [ "$FULL" != false ]; then decide true "Manual run with full=$FULL: the Mac jobs run."; fi
              if [ -z "$DEFAULT_BRANCH" ]; then decide true "Manual run: the default branch is unknown, so the Mac jobs run."; fi
              if ! base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD); then decide true "Manual run: no merge base with origin/$DEFAULT_BRANCH, so the Mac jobs run."; fi
              range=("$base" HEAD)
              ;;
            pull_request)
              base=$PR_BASE_SHA
              range=("$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            push)
              base=$PUSH_BEFORE
              if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then decide true "First push of the branch: there is no earlier commit to compare, so the Mac jobs run."; fi
              range=("$base" "$GITHUB_SHA")
              ;;
            *) decide true "Event $EVENT_NAME: no filter applies, so the Mac jobs run." ;;
          esac
          if ! git cat-file -e "$base^{commit}" 2> /dev/null; then decide true "The base commit ${base:-(none)} is not in the checkout, so the Mac jobs run."; fi
          if ! git diff --no-renames --name-only -z "${range[@]}" > "$RUNNER_TEMP/changed"; then decide true "git diff ${range[*]} failed, so the Mac jobs run."; fi
          hits=()
          while IFS= read -r -d '' file; do
            if mac_path "$file"; then hits+=("$file"); fi
          done < "$RUNNER_TEMP/changed"
          count=$(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c | tr -d ' ')
          if [ "${#hits[@]}" -eq 0 ]; then decide false "git diff ${range[*]}: $count changed path(s), none of them a Mac path. The Mac jobs are not needed."; fi
          printf 'Mac path: %s\n' "${hits[@]}"
          decide true "git diff ${range[*]}: ${#hits[@]} of $count changed path(s) are Mac paths, starting with ${hits[0]}."
  lint:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: eslint . (no-comments and the fences)
        run: pnpm lint
      - name: lint:comments (every language)
        run: pnpm lint:comments
      - name: lint:fences
        run: pnpm lint:fences
      - name: golangci-lint (guard/agent-go)
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$archive.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$archive:$PATH"
          pnpm lint:go
  guard:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: test-locations (agent-go)
        run: node scripts/check-test-locations.mjs
      - run: pnpm guard:agent:check
      - run: pnpm guard:go:e2e
      - name: test-locations (mac)
        run: node scripts/check-mac-test-targets.mjs
      - run: node scripts/verify-independent.mjs
      - run: pnpm licence:boundary
      - run: pnpm licence:manifest --check
  mac:
    needs: [gates, changes]
    if: ${{ !cancelled() && needs.gates.result == 'success' && needs.changes.outputs.mac != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: xcodegen drift (mac)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          if [ "$(xcodegen --version 2>/dev/null)" != "Version: $XCODEGEN_VERSION" ]; then
            curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
            echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
            echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          fi
          version=$(xcodegen --version)
          if [ "$version" != "Version: $XCODEGEN_VERSION" ]; then
            echo "::error::xcodegen on PATH is \"$version\", not $XCODEGEN_VERSION. The drift check must run the pinned version."
            exit 1
          fi
          (cd guard/mac && xcodegen generate --quiet)
          drift=$(git status --porcelain --untracked-files=all -- guard/mac/VibtraGuard.xcodeproj)
          if [ -n "$drift" ]; then
            echo "::error::guard/mac/VibtraGuard.xcodeproj is not what xcodegen $XCODEGEN_VERSION generates from guard/mac/project.yml. Run xcodegen generate in guard/mac and commit the result."
            echo "$drift"
            git diff -- guard/mac/VibtraGuard.xcodeproj
            exit 1
          fi
      - run: zsh guard/mac/build.sh --unsigned
  integration:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: NAT bridge for the guest registry CLI tests
        run: |
          sudo ip link add name bridge100 type bridge
          sudo ip addr add 192.168.64.1/24 dev bridge100
          sudo ip link add name bridge100-port type veth peer name bridge100-peer
          sudo ip link set bridge100-port master bridge100
          sudo ip link set bridge100-port up
          sudo ip link set bridge100-peer up
          sudo ip link set bridge100 up
          for _ in $(seq 1 20); do
            node -e 'process.exit((require("node:os").networkInterfaces().bridge100 ?? []).some((row) => row.address === "192.168.64.1") ? 0 : 1)' && exit 0
            sleep 0.5
          done
          ip addr show bridge100
          echo "Node does not list bridge100 with 192.168.64.1, so the guest registry CLI tests would refuse the binding." >&2
          exit 1
      - name: Integration tests with coverage
        env:
          GUARD_TEST_NAT_BRIDGE: bridge100
        run: pnpm --filter @vibtra/guard-tests exec vitest run integration/ --coverage --coverage.reportsDirectory=coverage/integration
      - name: Upload integration coverage (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-integration
          path: tests/coverage/integration
          if-no-files-found: error
      - name: Rust agent tests
        working-directory: guard/agent
        run: |
          cargo --version
          cargo test --tests --locked
  e2e-providers:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [openai-api, chatgpt, anthropic, gemini]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provider E2E tests
        env:
          PROVIDER: ${{ matrix.provider }}
          GUARD_AGENT_COVERDIR: ${{ runner.temp }}/go-cover-${{ matrix.provider }}
        run: pnpm --filter @vibtra/guard-tests exec vitest run "e2e/providers/$PROVIDER/"
      - name: Upload agent coverage (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-cover-${{ matrix.provider }}
          path: ${{ runner.temp }}/go-cover-${{ matrix.provider }}
          if-no-files-found: error
  e2e-capture-matrix:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: Install the matrix clients
        run: |
          sudo apt-get update
          sudo apt-get install -y curl openssl python3 python3-requests
          curl --version | head -n 1
          python3 -c 'import requests, ssl; print("requests", requests.__version__, ssl.OPENSSL_VERSION)'
          google-chrome --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture matrix E2E tests
        run: pnpm --filter @vibtra/guard-tests exec vitest run e2e/agent-go/
  e2e-console:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @vibtra/guard-tests exec playwright install --with-deps chromium
      - name: Console E2E tests
        run: pnpm --filter @vibtra/guard-tests test:e2e:browser
      - name: Upload Playwright report (actions/upload-artifact v7.0.2)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore
  mac-integration:
    needs: [gates, changes]
    if: ${{ !cancelled() && needs.gates.result == 'success' && needs.changes.outputs.mac != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: Install xcodegen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          if [ "$(xcodegen --version 2>/dev/null)" != "Version: $XCODEGEN_VERSION" ]; then
            curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
            echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
            echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          fi
          version=$(xcodegen --version)
          if [ "$version" != "Version: $XCODEGEN_VERSION" ]; then
            echo "::error::xcodegen on PATH is \"$version\", not $XCODEGEN_VERSION."
            exit 1
          fi
      - name: Mac integration tests
        run: zsh tests/mac/run.sh
      - name: Upload Mac integration logs (actions/upload-artifact v7.0.2)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-integration-logs
          path: guard/mac/build/logs
          if-no-files-found: ignore
  engine-done:
    needs: [gates, lint, guard, integration, e2e-providers]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out with full history (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$archive.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: engine-done (checks 1-5 and 7)
        run: node scripts/engine-done.mjs
  coverage:
    needs: [integration, e2e-providers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache: false
      - name: Download coverage artifacts (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '{coverage-integration,go-cover-*}'
          path: coverage-input
      - name: Coverage summary
        run: node tools/coverage/summary.mjs --input coverage-input --summary "$GITHUB_STEP_SUMMARY" --out coverage-summary.json
      - name: Upload coverage summary (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-summary
          path: coverage-summary.json
          if-no-files-found: error
