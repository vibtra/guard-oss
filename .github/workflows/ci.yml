name: Guard independent checks
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      full:
        description: Run the Mac jobs (mac and mac-integration) whatever the diff touches
        type: boolean
        default: true
  schedule:
    - cron: '0 17 * * 0'
permissions: {}
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for the gate checks on the pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "$EVENT_NAME event: the gate checks run on pull requests only. Nothing to wait for."
            exit 0
          fi
          checks=(gate-files tripwire probe-replay)
          workflows=(gate-files.yml easing-tripwire.yml gate-replay.yml)
          states=(- - -)
          report() {
            local row
            {
              echo "### Gate checks on $HEAD_SHA"
              echo
              echo "$1"
              echo
              echo "| Check | State |"
              echo "| --- | --- |"
              for row in "${!checks[@]}"; do
                echo "| ${checks[row]} | ${states[row]} |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          }
          ref=$(jq -rn --arg ref "$DEFAULT_BRANCH" '$ref | @uri')
          http_status() {
            gh api --include --silent "repos/$GITHUB_REPOSITORY/contents/$1?ref=$ref" 2>/dev/null | head -n 1 | cut -d ' ' -f 2 || true
          }
          expected=()
          for i in "${!checks[@]}"; do
            workflow=.github/workflows/${workflows[i]}
            for delay in 0 5 10; do
              sleep "$delay"
              status=$(http_status "$workflow")
              case "$status" in 200 | 404) break ;; esac
            done
            case "$status" in
              200) expected+=("$i") ;;
              404) states[i]="not waited for: $workflow is not on $DEFAULT_BRANCH" ;;
              *)
                echo "::error::Could not read $workflow on $DEFAULT_BRANCH (HTTP ${status:-no response})."
                exit 1
                ;;
            esac
          done
          if [ "${#expected[@]}" -eq 0 ]; then
            report "Passed: no gate workflow is on $DEFAULT_BRANCH yet."
            echo "No gate workflow is on $DEFAULT_BRANCH yet. Nothing to wait for."
            exit 0
          fi
          runs="$RUNNER_TEMP/check-runs.json"
          deadline=$((SECONDS + 900))
          while :; do
            waiting=""
            if gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100" > "$runs"; then
              for i in "${expected[@]}"; do
                states[i]=$(jq -rs --arg name "${checks[i]}" '[.[].check_runs[] | select(.name == $name and .app.slug == "github-actions")] | max_by(.id) | if . == null then "missing" elif .status == "completed" then .conclusion else .status end' "$runs")
                case "${states[i]}" in
                  success) ;;
                  missing | requested | queued | waiting | pending | in_progress) waiting+=" ${checks[i]}" ;;
                  *)
                    if [ "${checks[i]}" = tripwire ]; then
                      report "Failed: ${checks[i]} concluded ${states[i]}. Only success passes."
                      echo "::error::${checks[i]} concluded ${states[i]} on $HEAD_SHA. Only success passes. Push a fix, or get an approval on this exact commit and re-run ${checks[i]}. Then re-run this workflow."
                      exit 1
                    fi
                    ;;
                esac
              done
            else
              echo "::warning::Could not list the check runs on $HEAD_SHA. Trying again."
              for i in "${expected[@]}"; do waiting+=" ${checks[i]}"; done
            fi
            line=""
            for i in "${expected[@]}"; do line+=" ${checks[i]}=${states[i]}"; done
            echo "$(date -u +%H:%M:%S)$line"
            if [ -z "$waiting" ]; then
              report "Passed: every expected gate check has finished, and tripwire concluded success where expected."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              report "Failed: after 15 minutes still waiting for$waiting."
              echo "::error::After 15 minutes still waiting for$waiting on $HEAD_SHA."
              exit 1
            fi
            sleep 15
          done
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - name: Check out with full history, trees only (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Decide whether the diff touches the Mac app or the landing page
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          AREAS=(mac landing)
          decide() {
            local area
            for area in "${AREAS[@]}"; do echo "$area=$1" >> "$GITHUB_OUTPUT"; done
            echo "${AREAS[*]} = $1: $2"
            {
              echo "### Filtered jobs: ${AREAS[*]} all $1"
              echo
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          mac_path() {
            shopt -s nocasematch
            case "$1" in
              guard/mac/* | tests/mac/* | *.swift | *.xcodeproj/* | project.yml | */project.yml) return 0 ;;
              guard/agent-go/build.sh | guard/agent-go/go.mod) return 0 ;;
              guard/LICENSE | guard/NOTICE | guard/agent-go/THIRD_PARTY_NOTICES.txt) return 0 ;;
              .github/workflows/ci.yml) return 0 ;;
            esac
            return 1
          }
          landing_path() {
            shopt -s nocasematch
            case "$1" in
              apps/landing/*) return 0 ;;
              packages/ui/*) return 0 ;;
              guard/mac/project.yml) return 0 ;;
              .github/workflows/ci.yml) return 0 ;;
            esac
            return 1
          }
          case "$EVENT_NAME" in
            schedule) decide true "Scheduled run: the filtered jobs always run." ;;
            workflow_dispatch)
              if [ "$FULL" != false ]; then decide true "Manual run with full=$FULL: the filtered jobs run."; fi
              if [ -z "$DEFAULT_BRANCH" ]; then decide true "Manual run: the default branch is unknown, so the filtered jobs run."; fi
              if ! base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD); then decide true "Manual run: no merge base with origin/$DEFAULT_BRANCH, so the filtered jobs run."; fi
              range=("$base" HEAD)
              ;;
            pull_request)
              base=$PR_BASE_SHA
              range=("$PR_BASE_SHA...$PR_HEAD_SHA")
              ;;
            push)
              base=$PUSH_BEFORE
              if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then decide true "First push of the branch: there is no earlier commit to compare, so the filtered jobs run."; fi
              range=("$base" "$GITHUB_SHA")
              ;;
            *) decide true "Event $EVENT_NAME: no filter applies, so the filtered jobs run." ;;
          esac
          if ! git cat-file -e "$base^{commit}" 2> /dev/null; then decide true "The base commit ${base:-(none)} is not in the checkout, so the filtered jobs run."; fi
          if ! git diff --no-renames --name-only -z "${range[@]}" > "$RUNNER_TEMP/changed"; then decide true "git diff ${range[*]} failed, so the filtered jobs run."; fi
          mac_hits=()
          landing_hits=()
          while IFS= read -r -d '' file; do
            if mac_path "$file"; then mac_hits+=("$file"); fi
            if landing_path "$file"; then landing_hits+=("$file"); fi
          done < "$RUNNER_TEMP/changed"
          count=$(tr -cd '\0' < "$RUNNER_TEMP/changed" | wc -c | tr -d ' ')
          {
            echo "### Filtered jobs"
            echo
            echo "\`git diff ${range[*]}\`: $count changed path(s)."
            echo
            echo "| Area | Runs | Why |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          area() {
            local name=$1 run=$2 why=$3
            echo "$name=$run" >> "$GITHUB_OUTPUT"
            echo "$name=$run: $why"
            echo "| $name | $run | $why |" >> "$GITHUB_STEP_SUMMARY"
          }
          classify() {
            local name=$1 file
            shift
            if [ "$#" -eq 0 ]; then
              area "$name" false "none of the $count changed path(s) is a $name path, so the $name job(s) are not needed"
              return
            fi
            for file in "$@"; do echo "$name path: $file"; done
            area "$name" true "$# of $count changed path(s) are $name paths, starting with $1"
          }
          classify mac "${mac_hits[@]}"
          classify landing "${landing_hits[@]}"
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out with full history, trees only (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: The selection map matches the tree
        run: node scripts/select-tests.mjs --check-map
      - name: What the diff would run (shadow mode, everything still runs)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/select-tests.mjs --base "$BASE" --head "$HEAD" --github
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: eslint . (no-comments and the fences)
        run: pnpm lint
      - name: lint:comments (every language)
        run: pnpm lint:comments
      - name: lint:fences
        run: pnpm lint:fences
      - name: golangci-lint (guard/agent-go)
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$archive.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/$archive:$PATH"
          pnpm lint:go
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch origin/main for check-migrations
        run: git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: guard/agent-go/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$archive.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: check-migrations (unique numbers, new above origin/main, shipped ones untouched)
        run: node scripts/check-migrations.mjs
      - name: knip (unused files, dependencies and exports, test-only main-entry exports)
        run: node scripts/check-knip.mjs
      - name: check-mac-swift (#if DEBUG selects only a constant; privacy .public only on listed values)
        run: node scripts/check-mac-swift.mjs
      - name: Guardrail tests (each check fires on a fixture and is quiet on this tree)
        run: pnpm --filter @vibtra/guard-tests exec vitest run integration/eslint/guardrails.test.ts integration/scripts/check-migrations.test.ts integration/scripts/check-knip.test.ts integration/scripts/check-mac-swift.test.ts integration/infra/guardrails.test.ts integration/registry/config-variables.test.ts integration/agent-go/golangci-guardrails.test.ts
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: test-locations (agent-go)
        run: node scripts/check-test-locations.mjs
      - name: cloud-sdks (no @aws-sdk, @google-cloud or @azure under apps/ or packages/)
        run: node scripts/check-cloud-sdks.mjs
      - run: pnpm guard:agent:check
      - run: pnpm guard:go:e2e
      - name: test-locations (mac)
        run: node scripts/check-mac-test-targets.mjs
      - run: node scripts/verify-independent.mjs
      - run: pnpm licence:boundary
      - run: pnpm licence:manifest --check
  mac:
    needs: changes
    if: ${{ needs.changes.outputs.mac != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: xcodegen drift (mac)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          if [ "$(xcodegen --version 2>/dev/null)" != "Version: $XCODEGEN_VERSION" ]; then
            curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
            echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
            echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          fi
          version=$(xcodegen --version)
          if [ "$version" != "Version: $XCODEGEN_VERSION" ]; then
            echo "::error::xcodegen on PATH is \"$version\", not $XCODEGEN_VERSION. The drift check must run the pinned version."
            exit 1
          fi
          (cd guard/mac && xcodegen generate --quiet)
          drift=$(git status --porcelain --untracked-files=all -- guard/mac/VibtraGuard.xcodeproj)
          if [ -n "$drift" ]; then
            echo "::error::guard/mac/VibtraGuard.xcodeproj is not what xcodegen $XCODEGEN_VERSION generates from guard/mac/project.yml. Run xcodegen generate in guard/mac and commit the result."
            echo "$drift"
            git diff -- guard/mac/VibtraGuard.xcodeproj
            exit 1
          fi
      - run: zsh guard/mac/build.sh --unsigned
  integration-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch origin/main for the check-knip repository test
        run: git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: NAT bridge for the guest registry CLI tests
        run: |
          sudo ip link add name bridge100 type bridge
          sudo ip addr add 192.168.64.1/24 dev bridge100
          sudo ip link add name bridge100-port type veth peer name bridge100-peer
          sudo ip link set bridge100-port master bridge100
          sudo ip link set bridge100-port up
          sudo ip link set bridge100-peer up
          sudo ip link set bridge100 up
          for _ in $(seq 1 20); do
            node -e 'process.exit((require("node:os").networkInterfaces().bridge100 ?? []).some((row) => row.address === "192.168.64.1") ? 0 : 1)' && exit 0
            sleep 0.5
          done
          ip addr show bridge100
          echo "Node does not list bridge100 with 192.168.64.1, so the guest registry CLI tests would refuse the binding." >&2
          exit 1
      - name: Install golangci-lint for the VIB-65 guardrail tests
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$archive.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Download the Go modules the tests build (the tests then run with the module proxy off)
        run: |
          go -C guard/agent-go mod download
          go -C tests/support/hello-client mod download
      - name: Integration tests with coverage, shard ${{ matrix.shard }} of 6 (files split by tests/test-durations.json)
        env:
          GUARD_TEST_NAT_BRIDGE: bridge100
          GOPROXY: 'off'
          GOTOOLCHAIN: local
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @vibtra/guard-tests exec vitest run integration/ --shard="$SHARD/6" --coverage --reporter=default --reporter=blob
      - name: Upload the shard's blob report (actions/upload-artifact v7.0.2)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-blob-${{ matrix.shard }}
          path: tests/.vitest-reports
          include-hidden-files: true
          if-no-files-found: error
  rust-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cache cargo and guard/agent/target (Swatinem/rust-cache v2.9.3)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: guard/agent
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust agent tests
        working-directory: guard/agent
        run: |
          cargo --version
          cargo test --tests --locked
  integration:
    needs: [integration-shard, rust-agent]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Every shard and the Rust agent tests passed
        env:
          SHARDS: ${{ needs.integration-shard.result }}
          RUST: ${{ needs.rust-agent.result }}
        run: |
          echo "integration-shard: $SHARDS, rust-agent: $RUST"
          [ "$SHARDS" = success ] && [ "$RUST" = success ]
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the shards' blob reports (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: integration-blob-*
          path: tests/.vitest-reports
          merge-multiple: true
      - name: Merge the shards into one result and one coverage report
        run: pnpm --filter @vibtra/guard-tests exec vitest run --merge-reports --coverage --coverage.reportsDirectory=coverage/integration --reporter=default --reporter=json --outputFile.json=integration-report.json
      - name: Every integration test file ran in exactly one shard
        working-directory: tests
        run: |
          pnpm exec vitest list --filesOnly integration/ | sed -E 's#^.*(integration/)#\1#' | sort > "$RUNNER_TEMP/expected"
          node -e 'const r = require("./integration-report.json"); const p = require("node:path"); for (const t of r.testResults) console.log(p.relative(process.cwd(), t.name).split(p.sep).join("/"))' | sort > "$RUNNER_TEMP/ran"
          if ! diff "$RUNNER_TEMP/expected" "$RUNNER_TEMP/ran"; then
            echo "::error::The shards did not run each integration test file exactly once (< expected, > ran)."
            exit 1
          fi
          echo "$(wc -l < "$RUNNER_TEMP/ran") files, each in exactly one shard."
      - name: Upload integration coverage (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-integration
          path: tests/coverage/integration
          if-no-files-found: error
      - name: Upload the merged report, for refreshing tests/test-durations.json (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-report
          path: tests/integration-report.json
          if-no-files-found: error
  e2e-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [openai-api, chatgpt, anthropic, gemini]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Provider E2E tests
        env:
          PROVIDER: ${{ matrix.provider }}
          GUARD_AGENT_COVERDIR: ${{ runner.temp }}/go-cover-${{ matrix.provider }}
        run: pnpm --filter @vibtra/guard-tests exec vitest run "e2e/providers/$PROVIDER/"
      - name: Upload agent coverage (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-cover-${{ matrix.provider }}
          path: ${{ runner.temp }}/go-cover-${{ matrix.provider }}
          if-no-files-found: error
  e2e-capture-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install the matrix clients
        run: |
          sudo apt-get update
          sudo apt-get install -y curl openssl python3 python3-requests
          curl --version | head -n 1
          python3 -c 'import requests, ssl; print("requests", requests.__version__, ssl.OPENSSL_VERSION)'
          google-chrome --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture matrix E2E tests
        run: pnpm --filter @vibtra/guard-tests exec vitest run e2e/agent-go/
  e2e-console-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @vibtra/guard-tests exec playwright install --with-deps chromium
      - name: Console E2E tests, shard ${{ matrix.shard }} of 4
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @vibtra/guard-tests test:e2e:browser --shard="$SHARD/4"
      - name: Upload Playwright report (actions/upload-artifact v7.0.2)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore
  e2e-console:
    needs: e2e-console-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every console E2E shard passed
        env:
          SHARDS: ${{ needs.e2e-console-shard.result }}
        run: |
          echo "e2e-console-shard: $SHARDS"
          [ "$SHARDS" = success ]
  landing:
    needs: changes
    if: ${{ needs.changes.outputs.landing != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @vibtra/landing exec playwright install --with-deps chromium
      - name: Build the landing page
        run: pnpm --filter @vibtra/landing build
      - name: verify:landing (the page's contract against dist)
        env:
          SHOTS: ${{ runner.temp }}/landing-shots
        run: pnpm --filter @vibtra/landing verify:landing
      - name: Upload the verify:landing screenshots (actions/upload-artifact v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: landing-shots
          path: ${{ runner.temp }}/landing-shots
          if-no-files-found: ignore
  mac-integration:
    needs: changes
    if: ${{ needs.changes.outputs.mac != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install xcodegen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          if [ "$(xcodegen --version 2>/dev/null)" != "Version: $XCODEGEN_VERSION" ]; then
            curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
            echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
            echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          fi
          version=$(xcodegen --version)
          if [ "$version" != "Version: $XCODEGEN_VERSION" ]; then
            echo "::error::xcodegen on PATH is \"$version\", not $XCODEGEN_VERSION."
            exit 1
          fi
      - name: Mac integration tests
        run: zsh tests/mac/run.sh
      - name: Upload Mac integration logs (actions/upload-artifact v7.0.2)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-integration-logs
          path: guard/mac/build/logs
          if-no-files-found: ignore
  engine-done:
    needs: [lint, guard, integration, e2e-providers]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: 2.15.0
          GOLANGCI_LINT_SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea
        run: |
          archive="golangci-lint-$GOLANGCI_LINT_VERSION-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/golangci/golangci-lint/releases/download/v$GOLANGCI_LINT_VERSION/$archive.tar.gz"
          echo "$GOLANGCI_LINT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: engine-done (checks 2a, 2b, 3-5 and 7)
        run: node scripts/engine-done.mjs
  mutation-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: Check out with full history, trees only (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Decide whether the diff touches the mutation-tested modules, their tests and helpers, or the mutation settings
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) node scripts/mutation-paths.mjs --event "$EVENT_NAME" --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" ;;
            push) node scripts/mutation-paths.mjs --event "$EVENT_NAME" --base "$PUSH_BEFORE" --head "$GITHUB_SHA" ;;
            *) node scripts/mutation-paths.mjs --event "$EVENT_NAME" ;;
          esac
  mutation:
    needs: [gates, mutation-paths]
    if: ${{ !cancelled() && needs.gates.result == 'success' && (needs.mutation-paths.outputs.run == 'true' || needs.mutation-paths.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard-ci-only
          POSTGRES_DB: guard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIBTRA_TEST_DATABASE_URL: postgres://guard:guard-ci-only@127.0.0.1:5432/guard
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up pnpm (pnpm/action-setup v4.3.0)
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache-dependency-path: |
            guard/agent-go/go.sum
            tests/support/hello-client/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stryker on the security modules (the break threshold is in stryker.config.json)
        run: pnpm test:mutation --concurrency 4 --reporters clear-text,json
      - name: mutation-survivors (each surviving mutant is recorded in tests/mutation/survivors.json with a reason)
        run: pnpm test:mutation:survivors
      - name: Upload the mutation report (actions/upload-artifact v7.0.2)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
  coverage:
    needs: [integration, e2e-providers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Set up Go (actions/setup-go v5.6.0)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: guard/agent-go/go.mod
          cache: false
      - name: Download coverage artifacts (actions/download-artifact v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: '{coverage-integration,go-cover-*}'
          path: coverage-input
      - name: Coverage summary
        run: node tools/coverage/summary.mjs --input coverage-input --summary "$GITHUB_STEP_SUMMARY" --out coverage-summary.json
      - name: Upload coverage summary (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-summary
          path: coverage-summary.json
          if-no-files-found: error
