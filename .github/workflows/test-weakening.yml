name: test-weakening

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-weakening:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check out the default branch (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the PR's diff base from its current base branch (.github/actions/pr-base)
        id: base
        uses: ./.github/actions/pr-base

      - name: Read the PR body from the GitHub API and check the PR's tests with the default-branch script
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ steps.base.outputs.base_ref }}
          MERGE_BASE: ${{ steps.base.outputs.merge_base }}
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${REPO}/pulls/${PR_NUMBER}" | jq -r '.body // ""' > "$RUNNER_TEMP/body.md"
          echo "Checking ${HEAD_SHA} against ${BASE_REF} with the pull request body as it is now."
          status=0
          node scripts/check-test-weakening.mjs --event pull_request --base "$MERGE_BASE" --head "$HEAD_SHA" --body-file "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/out.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/out.txt"
          {
            echo "## test-weakening on ${HEAD_SHA}"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/out.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
