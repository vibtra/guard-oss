name: Ruleset drift
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/rulesets/main.json
      - scripts/check-ruleset-drift.mjs
      - tests/integration/scripts/check-ruleset-drift.test.ts
      - .github/workflows/ruleset-drift.yml
permissions: {}
concurrency:
  group: ruleset-drift-${{ github.ref }}
defaults:
  run:
    shell: bash
jobs:
  ruleset-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      TITLE: Ruleset drift on main
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out (actions/checkout v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: The rules GitHub enforces on main match .github/rulesets/main.json
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-ruleset-drift.mjs --repo "$GITHUB_REPOSITORY" --branch main 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/drift.txt"
      - name: Open or update the "Ruleset drift on main" issue
        if: failure() && steps.drift.outcome == 'failure' && github.event_name != 'pull_request'
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")"
          {
            echo "The [ruleset-drift run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) on \`$GITHUB_SHA\` failed. This issue closes when a run passes."
            echo
            echo '```'
            cat "$RUNNER_TEMP/drift.txt"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
      - name: Close the "Ruleset drift on main" issue
        if: success() && github.event_name != 'pull_request'
        run: |
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The [ruleset-drift run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) on \`$GITHUB_SHA\` passed."
          fi
