[package]
name = "vibtra-guard-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Vibtra Guard v0: the laptop agent (explicit proxy that decrypts only catalogued AI hosts, rule engine, Santa-shaped sync, block page)."
repository = "https://github.com/vibtra/guard-oss"
publish = false

[[bin]]
name = "vibtra-guard"
path = "src/main.rs"

[lib]
name = "vibtra_guard_agent"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
icu_normalizer = "2.3.0"
fancy-regex = "0.19.2"
futures = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
http-body-util = "0.1.5"
hudsucker = { version = "0.25.0", default-features = false, features = ["rcgen-ca", "rustls-client"] }
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
percent-encoding = "2.3.2"
rand = "0.10.3"
rcgen = { version = "0.14.10", features = ["x509-parser", "pem"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "0.23.46"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tokio-rustls = "0.26.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
